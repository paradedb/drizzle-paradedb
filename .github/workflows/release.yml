# workflows/release.yml
#
# Release
# Build and publish release artifacts to GitHub Releases and npm.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (semver, e.g., 0.1.0). Must match package.json."
        type: string
        required: true
      beta:
        description: "Mark as prerelease"
        type: boolean
        default: false
      confirmation:
        description: "I confirm version was incremented, tests pass, and CHANGELOG was updated."
        type: boolean
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build and Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Validate confirmation
        if: ${{ github.event.inputs.confirmation != 'true' }}
        run: |
          echo "❌ Please confirm the pre-release checklist"
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate version
        env:
          VERSION: ${{ github.event.inputs.version }}
          BETA: ${{ github.event.inputs.beta }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")

          # Check release doesn't exist
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "❌ Release v${VERSION} already exists"
            exit 1
          fi

          # Check npm package version doesn't exist
          if npm view "${PACKAGE_NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "❌ ${PACKAGE_NAME}@${VERSION} already exists on npm"
            exit 1
          fi

          # Validate beta suffix
          if [[ "${BETA}" == "true" && "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Beta releases must have prerelease suffix (e.g., 0.1.0-rc.1)"
            exit 1
          fi

          # Check package.json version
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "${VERSION}" != "${PACKAGE_VERSION}" ]]; then
            echo "❌ package.json version (${PACKAGE_VERSION}) doesn't match ${VERSION}"
            exit 1
          fi

          echo "✅ Version validation passed"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_ENV"

      - name: Determine if latest
        id: latest
        env:
          BETA: ${{ github.event.inputs.beta }}
        run: |
          set -euo pipefail
          git fetch --depth=1 --no-tags origin "+refs/tags/v*:refs/tags/v*"
          IS_LATEST=$(python3 - <<'PYTHON'
          import os
          import re
          import subprocess

          def stable_version(value):
              match = re.fullmatch(r"v?([0-9]+)\.([0-9]+)\.([0-9]+)", value)
              return tuple(map(int, match.groups())) if match else None

          target = stable_version(os.environ["VERSION"])
          if os.environ["BETA"] == "true":
              print("false")
          elif target is None:
              raise SystemExit("Non-beta releases must use a stable major.minor.patch version")
          else:
              tags = subprocess.check_output(["git", "tag", "-l", "v*"], text=True)
              versions = [version for tag in tags.splitlines() if (version := stable_version(tag))]
              print("true" if not versions or target >= max(versions) else "false")
          PYTHON
          )
          echo "is_latest=${IS_LATEST}" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: |
          pnpm build
          npm pack --dry-run
          echo "✅ Package built and validated"

      - name: Publish to npm
        env:
          BETA: ${{ github.event.inputs.beta }}
        run: |
          if [[ "${BETA}" == "true" ]]; then
            npm publish --access public --tag beta
          else
            npm publish --access public --tag latest
          fi
          echo "✅ Published ${PACKAGE_NAME} ${VERSION} to npm"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event.inputs.beta }}
          make_latest: ${{ steps.latest.outputs.is_latest }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          {
            echo "## 🚀 Released v${VERSION}"
            echo ""
            echo "- **npm**: https://www.npmjs.com/package/${PACKAGE_NAME}/v/${VERSION}"
            echo "- **Install**: \`pnpm add ${PACKAGE_NAME}@${VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
